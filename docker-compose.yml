services:
  db:
    image: postgres:16
    container_name: hotel_bookings_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: hotel_pass
      POSTGRES_DB: hotel_bookings_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./db/seed/001_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_admin -d hotel_bookings_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
